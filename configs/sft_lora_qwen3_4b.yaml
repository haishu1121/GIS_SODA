# Server LoRA pilot configuration for the verified GIS Concept OODA dataset.
model: Qwen/Qwen3-4B
method: lora
precision: bf16
trace_style: ooda
train_data: data/sft/gis-concept-v1/llm_augmented/train/anonymous_ooda_en.jsonl
validation_data: data/sft/gis-concept-v1/llm_augmented/validation/anonymous_ooda_en.jsonl
# The test split is intentionally absent. Use it only after checkpoint selection.
max_length: 7168
epochs: 3
learning_rate: 2.0e-5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
checkpoint_selection:
  metric: eval_loss
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
seed: 42
